name: Expand verified NMD3 Boss artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-bosses.yml'
      - 'scripts/discover_wiki_bosses.py'
      - 'catalog/wiki_boss_targets.json'

permissions:
  contents: write

concurrency:
  group: nmd3-asset-catalog-writes
  cancel-in-progress: false

jobs:
  collect-bosses:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image parser
        run: python -m pip install -r requirements.txt
      - name: Fetch verified Boss images from named BWiki pages
        run: python -u scripts/discover_wiki_bosses.py
      - name: Build optimized WebP thumbnails for every catalogued image
        run: python scripts/build_previews.py
      - name: Audit image file integrity
        run: python scripts/audit_assets.py
      - name: Export catalog CSV
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          cat=json.loads(Path("catalog/assets.json").read_text("utf-8"))
          keys=["id","name","category","subcategory","character","weapon_family","variant_kind","review_status","visual_review","original_record_name","classification_note","image_url","source_page","local_path","download_status","width","height","has_alpha","sha256","quality_tier","classification_source"]
          with open("catalog/assets.csv","w",encoding="utf-8",newline="") as file:
              writer=csv.DictWriter(file,fieldnames=keys,extrasaction="ignore")
              writer.writeheader()
              writer.writerows([{k:item.get(k,"") for k in keys} for item in cat["assets"]])
          PY
      - name: Validate category consistency
        run: python scripts/validate_taxonomy.py
      - name: Commit successful Boss downloads
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/assets.json catalog/assets.csv
          git add -A previews/
          if [ -d assets/bosses/wiki ]; then git add assets/bosses/wiki; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified NMD3 Boss image files"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new Boss images passed checks"
          fi
