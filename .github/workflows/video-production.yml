name: Ninja 3 Video Production

# This workflow constrains production stages, never creative direction.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Path to YOUR project.json in the repository (no fixed episode list)'
        required: true
        type: string
      stage:
        description: 'Preview, final, or preview then final'
        required: true
        default: all
        type: choice
        options:
          - all
          - preview
          - final
  push:
    paths:
      - 'mv/**'
      - 'video/**'
      - '.github/workflows/video-production.yml'
  pull_request:
    paths:
      - 'mv/**'
      - 'video/**'
      - '.github/workflows/video-production.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify independent video projects
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ninja 3 source
        uses: actions/checkout@v4
        with:
          path: ninja
      - name: Fetch optional music assets for legacy MV sample
        uses: actions/checkout@v4
        with:
          repository: tyqittle/anime-music-library
          path: music
      - name: Install common verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install pillow numpy
      - name: Compile Python sources
        run: |
          python -m py_compile ninja/mv/make_mv.py ninja/video/workflow/scripts/production.py ninja/video/workflow/scripts/render.py ninja/video/workflow/scripts/audio.py ninja/video/workflow/scripts/check.py ninja/video/workflow/scripts/test_audio.py ninja/video/workflow/scripts/test_production.py ninja/video/projects/fentian-ad-parody/render.py
      - name: Test generic video workflow (no fixed visual language)
        run: python ninja/video/workflow/scripts/test_production.py
      - name: Test existing dialogue engine
        run: python ninja/video/workflow/scripts/test_audio.py
      - name: Verify project sources and manifests
        run: python ninja/video/workflow/scripts/production.py --stage validate-all
      - name: Test legacy dialogue data as a regression only
        run: |
          python ninja/video/workflow/scripts/check.py ninja/video/workflow/episodes/deep-abyss-meeting-v1.json
          python ninja/video/workflow/scripts/check.py ninja/video/workflow/episodes/blood-shadow-interview-v1.json
      - name: Preview dialogue example independently
        run: python ninja/video/workflow/scripts/production.py --project video/projects/deep-abyss-meeting/project.json --stage preview
      - name: Preview music video example independently
        run: python ninja/video/workflow/scripts/production.py --project video/projects/shadow-protocol-mv/project.json --stage preview

  produce:
    name: Build user-selected creative project
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[render-video:'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Ninja 3 source
        uses: actions/checkout@v4
        with:
          path: ninja
      - name: Fetch optional music assets
        uses: actions/checkout@v4
        with:
          repository: tyqittle/anime-music-library
          path: music
      - name: Install common media tools (other dependencies are per project)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core espeak-ng
      - name: Follow this project's render commands
        env:
          PROJECT: ${{ inputs.project }}
          STAGE: ${{ inputs.stage || 'all' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$PROJECT" ]; then
            PROJECT="$(python - <<'PY'
          import os, re
          message = os.environ.get("COMMIT_MESSAGE", "")
          hit = re.search(r'\[render-video:(video/projects/[a-zA-Z0-9_./-]+/project\.json)\]', message)
          if not hit:
              raise SystemExit("No valid [render-video:video/projects/name/project.json] in commit")
          print(hit.group(1))
          PY
            )"
          fi
          python ninja/video/workflow/scripts/production.py --project "$PROJECT" --stage "$STAGE"
      - name: Upload rendered video and project outputs
        uses: actions/upload-artifact@v4
        with:
          name: ninja3-production-${{ github.run_number }}
          path: output/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish opt-in MP4 directly into the repository
        env:
          PROJECT: ${{ inputs.project }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          manifest = os.environ.get("PROJECT", "")
          if not manifest:
              hit = re.search(r'\[render-video:(video/projects/[a-zA-Z0-9_./-]+/project\.json)\]', os.environ.get("COMMIT_MESSAGE", ""))
              if not hit:
                  raise SystemExit("No project requested")
              manifest = hit.group(1)
          repo = Path("ninja").resolve()
          doc = json.loads((repo / manifest).read_text(encoding="utf-8"))
          if doc.get("publish_pages") is not True:
              print("Opt-in publication disabled for", doc["id"])
              raise SystemExit(0)
          source = (Path.cwd() / doc["render"]["final"]["output"].format(id=doc["id"])).resolve()
          if not source.is_file() or not source.is_relative_to((Path.cwd()/"output").resolve()):
              raise SystemExit("Final MP4 missing or outside output directory")
          dest = repo / "video" / "exports" / (doc["id"] + ".mp4")
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, dest)
          print("Direct MP4 ready:", dest, dest.stat().st_size)
          PY
          cd ninja
          git add video/exports
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(video): publish opt-in MP4 [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No MP4 publication requested"
          fi
