name: Ninja 3 Video Production

# This workflow constrains production stages, never creative direction.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Path to YOUR project.json in the repository (no fixed episode list)'
        required: true
        type: string
      stage:
        description: 'Preview, final, or preview then final'
        required: true
        default: all
        type: choice
        options:
          - all
          - preview
          - final
  push:
    paths:
      - 'mv/**'
      - 'video/**'
      - '.github/workflows/video-production.yml'
  pull_request:
    paths:
      - 'mv/**'
      - 'video/**'
      - '.github/workflows/video-production.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify independent video projects
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ninja 3 source
        uses: actions/checkout@v4
        with:
          path: ninja
      - name: Fetch optional music assets for legacy MV sample
        uses: actions/checkout@v4
        with:
          repository: tyqittle/anime-music-library
          path: music
      - name: Install common verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install pillow numpy
      - name: Compile Python sources
        run: |
          python -m py_compile ninja/mv/make_mv.py ninja/video/workflow/scripts/production.py ninja/video/workflow/scripts/render.py ninja/video/workflow/scripts/audio.py ninja/video/workflow/scripts/check.py ninja/video/workflow/scripts/test_audio.py ninja/video/workflow/scripts/test_production.py
      - name: Test generic video workflow (no fixed visual language)
        run: python ninja/video/workflow/scripts/test_production.py
      - name: Test existing dialogue engine
        run: python ninja/video/workflow/scripts/test_audio.py
      - name: Verify project sources and manifests
        run: python ninja/video/workflow/scripts/production.py --stage validate-all
      - name: Test legacy dialogue data as a regression only
        run: |
          python ninja/video/workflow/scripts/check.py ninja/video/workflow/episodes/deep-abyss-meeting-v1.json
          python ninja/video/workflow/scripts/check.py ninja/video/workflow/episodes/blood-shadow-interview-v1.json
      - name: Preview dialogue example independently
        run: python ninja/video/workflow/scripts/production.py --project video/projects/deep-abyss-meeting/project.json --stage preview
      - name: Preview music video example independently
        run: python ninja/video/workflow/scripts/production.py --project video/projects/shadow-protocol-mv/project.json --stage preview

  produce:
    name: Build user-selected creative project
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Ninja 3 source
        uses: actions/checkout@v4
        with:
          path: ninja
      - name: Fetch optional music assets
        uses: actions/checkout@v4
        with:
          repository: tyqittle/anime-music-library
          path: music
      - name: Install common media tools (other dependencies are per project)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core espeak-ng
      - name: Follow this project's render commands
        env:
          PROJECT: ${{ inputs.project }}
          STAGE: ${{ inputs.stage }}
        run: |
          python ninja/video/workflow/scripts/production.py --project "$PROJECT" --stage "$STAGE"
      - name: Upload rendered video and project outputs
        uses: actions/upload-artifact@v4
        with:
          name: ninja3-production-${{ github.run_number }}
          path: output/**
          if-no-files-found: error
          retention-days: 30
