name: Build lightweight NMD3 gallery previews

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'catalog/assets.json'
      - 'scripts/build_previews.py'
      - '.github/workflows/build-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nmd3-asset-catalog-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=10.0.0"
      - name: Make optimized WebP previews
        run: python scripts/build_previews.py
      - name: Commit previews (original images remain untouched)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A previews/
          if ! git diff --cached --quiet; then
            git commit -m "Build lightweight WebP gallery previews"
            git pull --rebase origin main
            git push
          else
            echo "Previews are already up to date."
          fi
