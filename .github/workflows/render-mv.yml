name: Render Ninja 3 MV
on:
  workflow_dispatch:
  push:
    paths:
      - 'mv/**'
      - '.github/workflows/render-mv.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ninja materials
        uses: actions/checkout@v4
        with:
          path: ninja
      - name: Checkout music library
        uses: actions/checkout@v4
        with:
          repository: tyqittle/anime-music-library
          path: music
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core
      - name: Render MP4
        run: python3 ninja/mv/make_mv.py
      - name: Verify output
        run: |
          test -s output/ninja3-shadow-bloom-mv.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/ninja3-shadow-bloom-mv.mp4
      - name: Publish MP4 as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninja3-shadow-bloom-mv
          path: output/ninja3-shadow-bloom-mv.mp4
          retention-days: 30
