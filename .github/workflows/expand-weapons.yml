name: Expand NMD3 weapon artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-weapons.yml'
      - 'scripts/discover_wiki_weapons.py'
      - 'catalog/wiki_weapon_targets.json'
permissions:
  contents: write
concurrency:
  group: nmd3-asset-catalog-writes
  cancel-in-progress: false
jobs:
  collect-weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validated image parser
        run: python -m pip install -r requirements.txt
      - name: Fetch verifiable weapon images
        run: python -u scripts/discover_wiki_weapons.py
      - name: Audit repository binaries
        run: python -u scripts/audit_assets.py
      - name: Regenerate download catalog CSV
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          cat=json.loads(Path("catalog/assets.json").read_text("utf-8"))
          keys=["id","name","category","subcategory","character","image_url","source_page","local_path","download_status","width","height","has_alpha","sha256","quality_tier"]
          with open("catalog/assets.csv","w",encoding="utf-8",newline="") as f:
              writer=csv.DictWriter(f,fieldnames=keys,extrasaction="ignore")
              writer.writeheader()
              writer.writerows([{k:item.get(k,"") for k in keys} for item in cat["assets"]])
          PY
      - name: Commit images that really exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/assets.json catalog/assets.csv
          if [ -d assets/weapons/wiki ]; then git add assets/weapons/wiki; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified NMD3 weapon images"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new weapon files passed checks"
          fi
