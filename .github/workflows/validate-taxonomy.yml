name: Validate NMD3 asset taxonomy
on:
  push:
    branches: [main]
    paths:
      - 'catalog/assets.json'
      - 'catalog/assets.csv'
      - 'index.html'
      - 'scripts/validate_taxonomy.py'
      - '.github/workflows/validate-taxonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify category and subtype consistency
        run: python scripts/validate_taxonomy.py
      - name: Check gallery inline JavaScript syntax
        run: |
          node - <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match)throw new Error('Gallery JS not found');
          new vm.Script(match[1],{filename:'gallery.js'});
          console.log('Gallery JavaScript: syntax PASS');
          JS
