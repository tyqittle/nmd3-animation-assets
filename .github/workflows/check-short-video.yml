name: Verify Ninja 3 Video Workflow
on:
  push:
    paths:
      - 'video/workflow/**'
      - '.github/workflows/check-short-video.yml'
  pull_request:
    paths:
      - 'video/workflow/**'
      - '.github/workflows/check-short-video.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install renderer requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install pillow numpy
      - name: Check storyboard and original art
        run: python video/workflow/scripts/check.py video/workflow/episodes/deep-abyss-meeting-v1.json
      - name: Render short draft as regression test
        run: python video/workflow/scripts/render.py --recipe video/workflow/episodes/deep-abyss-meeting-v1.json --quality draft --tts off --seconds 2 --output output/smoke.mp4
      - name: Verify codecs
        run: |
          test -s output/smoke.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json output/smoke.mp4
