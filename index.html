<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="忍者必须死3角色、Boss、武器与背景素材图鉴，支持搜索、原图预览及素材源文件直达。">
<title>忍3视觉素材库 · Ninja Must Die 3</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;--paper:#0e1016;--layer:#1b1e28;--ink:#e8e9f0;--muted:#a0a6b4;--border:#34394a;--red:#eb607d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#3a172a 0,transparent 33%),#0e1016;color:var(--ink);min-height:100vh}
header{padding:45px max(24px,calc((100vw - 1420px)/2)) 35px;background:linear-gradient(135deg,#2b1927,#181d2d 80%);border-bottom:1px solid #473041}
header .eyebrow{letter-spacing:.2em;color:#ec8da4;font-size:12px;font-weight:700;margin-bottom:15px}
h1{font-size:clamp(28px,4vw,46px);letter-spacing:.025em;margin:0 0 12px}header p{color:#c0bfcc;font-size:14px;line-height:1.8;margin:0}
main{max-width:1480px;margin:auto;padding:26px 24px 65px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 24px;color:#b4bac7;font-size:13px}.stats strong{color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
input,select{font:inherit;background:#202430;color:#eef0f5;border:1px solid #4c5163;border-radius:11px;padding:11px 14px;outline:none}
input:focus,select:focus{border-color:var(--red)}input{min-width:200px;flex:1;max-width:355px}select{cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1px solid #494658;background:#252430;color:#d6d6df;border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:#e7899f}button.active{background:#973852;border-color:#d85c7c;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.card{background:rgba(32,35,47,.88);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.card:hover{border-color:#a75670;transform:translateY(-2px)}
.poster{height:260px;background:linear-gradient(150deg,#353240,#171d29);display:flex;align-items:center;justify-content:center;position:relative}
.poster img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.poster span{position:absolute;bottom:8px;right:8px;background:rgba(7,10,17,.78);border-radius:6px;padding:3px 7px;color:#b6c1d5;font-size:11px}
.meta{padding:13px 14px 16px}.meta h3{font-size:15px;margin:0 0 8px;font-weight:650}
.meta p{color:#9ca4b2;font-size:12px;margin:5px 0}.actions{display:flex;gap:13px;align-items:center;margin-top:11px}.actions a{color:#ef91a8;font-size:12px;text-decoration:none}.actions a:hover{text-decoration:underline}
.notice{font-size:12px;color:#818998;margin:25px 0;line-height:1.7}
#empty{padding:55px;text-align:center;color:#b8bfcd;border:1px dashed #565c6c;border-radius:12px}
dialog{border:1px solid #535666;border-radius:16px;background:#11141c;color:#eee;max-width:min(94vw,1200px);max-height:95vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.84)}dialog img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain}dialog .dtop{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px}.category-help{color:#b3bdca;font-size:12px;line-height:1.7;margin:-9px 0 20px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tag{font-size:11px;color:#cdd5dc;border:1px solid #465061;background:#272b38;border-radius:5px;padding:2px 7px}
.tag.top{color:#f2b5c3;border-color:#7e435c;background:#402432}
#subtype,#role,#sort{max-width:210px}
dialog a{color:#ff9ab0}
@media(max-width:700px){header{padding:30px 22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.poster{height:210px}.toolbar input{max-width:none}.meta{padding:10px}.meta h3{font-size:13px}}

/* Performance: reserve card and viewer geometry before images finish decoding. */
.card{content-visibility:auto;contain-intrinsic-size:auto 386px}
.poster{contain:layout paint;overflow:hidden}
.preview-button{appearance:none;display:block;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;cursor:zoom-in;overflow:hidden}
.preview-button:focus-visible{outline:3px solid #ffb1c5;outline-offset:-3px}
.preview-button img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .18s ease;opacity:0}
.preview-button img.loaded{opacity:1}
#more-wrap{display:flex;justify-content:center;padding:26px 0}
#more-wrap[hidden]{display:none}
#more{min-width:150px}
#viewer{width:min(96vw,1100px);max-width:1100px;max-height:94vh}
.viewer-stage{height:min(72vh,730px);min-height:min(48vh,340px);display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse,#242a37,#10131b 74%);border-radius:10px}
.viewer-stage img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .16s ease}
.viewer-stage.ready img{opacity:1}
.loading-label{position:absolute;inset:0;display:grid;place-items:center;color:#c5cad8;font-size:13px;pointer-events:none;text-align:center;padding:20px}
.viewer-stage.ready .loading-label{display:none}
@media (prefers-reduced-motion:reduce){.card,.preview-button img,.viewer-stage img{transition:none}}
@media(max-width:700px){.card{contain-intrinsic-size:auto 356px}.viewer-stage{height:65vh;min-height:260px}}
</style></head>
<body>
<header><div class="eyebrow">NINJA MUST DIE 3 / ART ARCHIVE</div><h1>忍3视觉素材库</h1><p>忍者与流派 · 角色皮肤 · 武器与幻化 · Boss · 场景 · 壁纸 · 宣传 · 特效<br>按大类、细分类和角色精准筛选；图片从 GitHub 仓库读取。</p></header>
<main>
 <div class="stats" id="stats">正在载入素材……</div>
 <div class="toolbar">
  <input id="search" placeholder="搜索：隼白、琳、苍牙、背景……" aria-label="搜索素材">
  <nav id="filters" aria-label="素材分类"></nav>
  <select id="subtype" aria-label="选择细分类"><option value="all">全部细分类</option></select>
  <select id="role" aria-label="按角色筛选"><option value="all">全部角色</option></select>
  <select id="quality" aria-label="筛选清晰度">
   <option value="all">全部清晰度</option>
   <option value="hd">较高清（≥ 700px）</option>
   <option value="alpha">带透明通道</option>
  </select>
  <select id="sort" aria-label="排序"><option value="group">按角色/类型排序</option><option value="name">按名称排序</option><option value="recent">新入库优先</option></select>
  <button id="review-toggle" type="button" aria-pressed="false">查看待核对素材</button>
 </div>
 <p class="category-help" id="category-help" aria-live="polite"></p>
 <div class="grid" id="grid" aria-live="polite"></div>
 <div id="more-wrap" hidden><button id="more" type="button">加载更多素材</button></div>
 <div id="empty" hidden>没有符合条件的已下载图片，请试试其他关键词或分类。</div>
 <p class="notice">图像版权归原权利方；这里是个人非官方素材索引，不代表拥有再分发或商业使用授权。发现原图与标注不符的条目已隔离到“查看待核对素材”，不再混入正常角色立绘；多数图片仍待全面目检。“场景参考”不代表纯净背景。</p>
</main>
<dialog id="viewer"><div class="dtop"><strong id="viewer-title"></strong><button id="viewer-close">关闭 ×</button></div><div class="viewer-stage" id="viewer-stage"><img id="viewer-img" alt=""><span class="loading-label" id="viewer-loading" role="status">正在加载高清原图……</span></div><div class="actions"><a id="viewer-original" target="_blank" rel="noopener">打开仓库原图</a><a id="viewer-source" target="_blank" rel="noopener">查看来源</a></div></dialog>
<script>
"use strict";
const cats=[
 ["all","全部"],["characters","忍者角色"],["weapons","武器"],["bosses","Boss"],
 ["scenes","场景参考"],["wallpapers","壁纸构图"],["promos","活动宣传"],["effects","战斗特效"]
];
const subLabels={
 base_portrait:"基础立绘",style_portrait:"忍者流派",costume_portrait:"角色皮肤",
 pose_reference:"动作参考",alternate_portrait:"立绘其他版本",character_reference:"角色宣传参考",
 boss_art:"Boss立绘",weapon_art:"武器本体",weapon_appearance:"武器幻化",
 scene_reference:"场景参考",wallpaper_composite:"壁纸构图",unverified_wallpaper:"待采集壁纸",
 event_promo:"活动宣传图",promo_composite:"复合宣传插画",awakening_portrait:"流派觉醒外观",skill_effect_reference:"技能/忍术特效"
};
const explanations={
 all:"人物按角色归组，区分基础立绘、流派与皮肤；其他画面不再一律归到“背景”。",
 characters:"忍者角色按人物、流派、外观与动作类型区分；流派不是皮肤，动作参考不是独立的新角色。",
 weapons:"普通武器和武器幻化分别显示；武器幻化不能标成角色皮肤。",
 bosses:"独立的敌人和Boss图片，不与可操作忍者混淆。",
 scenes:"场景参考不一定是可直接复用的纯背景。需要人工确认人物、文字和遮挡情况。",
 wallpapers:"含场景构图或人物的壁纸、复合画面；不冒充无字的纯场景。",
 promos:"纪念、活动、宣传、角色展示图，不应放在纯净背景类。",
 effects:"角色忍术、战斗技能、特效镜头的画面参考，不当作完整角色立绘。"
};
const mapLabel=Object.fromEntries(cats);
let data=[],category="all",subtype="all",role="all",term="",quality="all",sort="group",reviewMode="normal";
const listed=()=>data.filter(a=>reviewMode==="quarantined"?a.review_status==="quarantined":a.review_status!=="quarantined");
const $=s=>document.querySelector(s);
const localPath=a=>"./"+a.local_path;
const groupName=a=>a.category==="characters"?(a.character||"其他角色"):(a.category==="weapons"?(a.weapon_family||a.name):"");
const textFor=a=>[a.name,a.character||"",a.weapon_family||"",a.id,mapLabel[a.category]||"",subLabels[a.subcategory]||""].join(" ").toLowerCase();
const originalHref=a=>a.source_page&&a.source_page.startsWith("https://")?a.source_page:"https://github.com/tyqittle/nmd3-animation-assets";
// The grid always starts small; subsequent pages are appended without rebuilding.
const PAGE_SIZE=24;
let visibleRows=[],rendered=0,loadObserver=null,viewerToken=0,searchTimer=null;
const previewPath=a=>"./previews/"+a.local_path.replace(/\\.[^.\\/]+$/,".webp");

function openViewer(a){
 const viewer=$("#viewer"),stage=$("#viewer-stage"),image=$("#viewer-img");
 const token=++viewerToken;
 const src=localPath(a);
 $("#viewer-title").textContent=a.name+" · "+(subLabels[a.subcategory]||mapLabel[a.category]||"参考");
 $("#viewer-original").href=src;
 $("#viewer-source").href=originalHref(a);
 image.alt=a.name;
 image.removeAttribute("src");
 stage.classList.remove("ready");
 $("#viewer-loading").textContent="正在加载高清原图……";
 if(!viewer.open)viewer.showModal();
 const preload=new Image();
 preload.decoding="async";
 const finish=()=>{
  if(token!==viewerToken||!viewer.open)return;
  image.src=src;
  stage.classList.add("ready");
 };
 preload.onload=()=>{
  if(typeof preload.decode==="function")preload.decode().catch(()=>{}).then(finish);
  else finish();
 };
 preload.onerror=()=>{
  if(token!==viewerToken)return;
  $("#viewer-loading").textContent="加载失败，请使用下方「打开仓库原图」重试";
 };
 preload.src=src;
}
$("#viewer-close").onclick=()=>$("#viewer").close();
$("#viewer").onclick=e=>{if(e.target===$("#viewer"))$("#viewer").close()};
$("#viewer").addEventListener("close",()=>{viewerToken++;$("#viewer-img").removeAttribute("src");$("#viewer-stage").classList.remove("ready")});
$("#search").oninput=e=>{
 term=e.target.value.trim().toLowerCase();
 clearTimeout(searchTimer);
 searchTimer=setTimeout(paint,120);
};
$("#quality").onchange=e=>{quality=e.target.value;paint()};
$("#sort").onchange=e=>{sort=e.target.value;paint()};
$("#review-toggle").onclick=()=>{
 reviewMode=reviewMode==="normal"?"quarantined":"normal";
 category="all";subtype="all";role="all";term="";$("#search").value="";
 $("#review-toggle").setAttribute("aria-pressed",String(reviewMode==="quarantined"));
 $("#review-toggle").textContent=reviewMode==="quarantined"?"返回已分类素材":"查看待核对素材";
 updateSelectors();paint();
};
$("#subtype").onchange=e=>{subtype=e.target.value;paint()};
$("#role").onchange=e=>{role=e.target.value;paint()};
$("#more").onclick=loadMore;

function updateSelectors(){
 const items=listed();
 const types=[...new Set(items.filter(a=>category==="all"||a.category===category).map(a=>a.subcategory).filter(Boolean))];
 types.sort((a,b)=>(subLabels[a]||a).localeCompare(subLabels[b]||b,"zh"));
 if(!types.includes(subtype))subtype="all";
 $("#subtype").replaceChildren(new Option("全部细分类","all"),...types.map(t=>new Option(subLabels[t]||t,t)));
 $("#subtype").value=subtype;
 const people=[...new Set(items.filter(a=>a.category==="characters").map(a=>a.character).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh"));
 if(category!=="all"&&category!=="characters")role="all";
 if(!people.includes(role))role="all";
 $("#role").replaceChildren(new Option("全部角色","all"),...people.map(p=>new Option(p,p)));
 $("#role").value=role;
 $("#role").hidden=category!=="all"&&category!=="characters";
 $("#category-help").textContent=explanations[category]||"";
}

function createCard(a,index){
 const art=document.createElement("article");art.className="card";
 const poster=document.createElement("div");poster.className="poster";
 const open=document.createElement("button");open.type="button";open.className="preview-button";
 open.setAttribute("aria-label","查看高清原图："+a.name);
 open.addEventListener("click",()=>openViewer(a));
 const im=document.createElement("img");
 im.alt=a.name;im.width=420;im.height=560;im.decoding="async";
 im.loading=index<4?"eager":"lazy";
 im.fetchPriority=index<2?"high":"low";
 im.addEventListener("load",()=>im.classList.add("loaded"));
 im.addEventListener("error",()=>{
  if(im.dataset.fallback!=="1"){
   im.dataset.fallback="1";
   im.src=localPath(a); // New items remain viewable before previews are built.
  }else{
   open.textContent="预览加载失败，点此查看原图";
   open.style.color="#b8bfcd";
  }
 });
 im.src=previewPath(a);
 open.append(im);poster.append(open);
 if(a.width&&a.height){
  const sz=document.createElement("span");
  sz.textContent=a.width+" × "+a.height;
  sz.setAttribute("aria-hidden","true");
  poster.append(sz);
 }
 const meta=document.createElement("div");meta.className="meta";
 const h=document.createElement("h3");h.textContent=a.name;meta.append(h);
 const chips=document.createElement("div");chips.className="badges";
 for(const [label,top] of [[mapLabel[a.category]||a.category,true],[subLabels[a.subcategory]||"待细分",false]]){
  const el=document.createElement("span");el.className="tag"+(top?" top":"");
  el.textContent=label;chips.append(el);
 }
 if(a.review_status==="quarantined"){
  const tip=document.createElement("span");tip.className="tag top";
  tip.textContent="身份/类型待核对";chips.append(tip);
 }
 meta.append(chips);
 if(a.review_status==="quarantined"){
  const note=document.createElement("p");
  note.textContent=a.classification_note||"原名称与实际图片不吻合，待核对";
  meta.append(note);
 }
 if((a.category==="characters"&&a.character)||(a.category==="weapons"&&a.weapon_family)){
  const p=document.createElement("p");
  p.textContent=(a.category==="characters"?"所属角色：":"武器系列：")+groupName(a);
  meta.append(p);
 }
 const actions=document.createElement("div");actions.className="actions";
 for(const [label,url] of [["查看原图",localPath(a)],["素材来源",originalHref(a)]]){
  const link=document.createElement("a");
  link.textContent=label;link.href=url;link.target="_blank";link.rel="noopener";
  actions.append(link);
 }
 meta.append(actions);art.append(poster,meta);
 return art;
}

function loadMore(){
 if(rendered>=visibleRows.length)return;
 const end=Math.min(rendered+PAGE_SIZE,visibleRows.length);
 const frag=document.createDocumentFragment();
 for(let i=rendered;i<end;i++)frag.append(createCard(visibleRows[i],i));
 $("#grid").append(frag);
 rendered=end;
 const more=$("#more-wrap");
 more.hidden=rendered>=visibleRows.length;
 if(loadObserver){
  loadObserver.disconnect();
  if(!more.hidden)loadObserver.observe(more);
 }
}
if("IntersectionObserver" in window){
 loadObserver=new IntersectionObserver(entries=>{
  if(entries.some(e=>e.isIntersecting))loadMore();
 },{rootMargin:"420px 0px"});
}

function paint(){
 if(loadObserver)loadObserver.disconnect();
 const items=listed();
 const counts=Object.create(null);
 for(const a of items)counts[a.category]=(counts[a.category]||0)+1;
 const filter=$("#filters");const buttons=document.createDocumentFragment();
 for(const [id,label] of cats){
  const b=document.createElement("button");
  b.type="button";b.textContent=label+" "+(id==="all"?items.length:(counts[id]||0));
  b.className=id===category?"active":"";
  b.setAttribute("aria-pressed",String(id===category));
  b.onclick=()=>{category=id;subtype="all";updateSelectors();paint()};
  buttons.append(b);
 }
 filter.replaceChildren(buttons);
 visibleRows=items.filter(a=>
  (category==="all"||a.category===category)&&
  (subtype==="all"||a.subcategory===subtype)&&
  (role==="all"||(a.category==="characters"&&a.character===role))&&
  (!term||(a._search||textFor(a)).includes(term))&&
  (quality==="all"||(quality==="hd"&&Math.max(a.width||0,a.height||0)>=700)||
  (quality==="alpha"&&a.has_alpha===true))
 );
 const order=Object.fromEntries(cats.map((v,i)=>[v[0],i]));
 visibleRows.sort((a,b)=>sort==="recent"?(b._index-a._index):
  sort==="name"?a.name.localeCompare(b.name,"zh"):
  (order[a.category]-order[b.category])||
  groupName(a).localeCompare(groupName(b),"zh")||
  (subLabels[a.subcategory]||"").localeCompare(subLabels[b.subcategory]||"","zh")||
  a.name.localeCompare(b.name,"zh"));
 rendered=0;
 $("#grid").replaceChildren();
 $("#empty").hidden=visibleRows.length>0;
 $("#more-wrap").hidden=true;
 loadMore();
 $("#stats").textContent="仓库共 "+data.length+" 张真实文件 · "+(reviewMode==="quarantined"?"待核对":"已分类")+" "+items.length+" 张 · 当前筛选 "+visibleRows.length+" 张；列表优先使用轻量预览，点击加载高清原图";
}
fetch("./catalog/assets.json",{cache:"no-cache"}).then(r=>{
 if(!r.ok)throw Error("HTTP "+r.status);return r.json()
}).then(cat=>{
 data=cat.assets.filter(a=>a.download_status==="downloaded"&&a.local_path);
 data.forEach((a,i)=>{a._index=i;a._search=textFor(a)});
 updateSelectors();paint();
}).catch(err=>{
 $("#stats").textContent="素材索引加载失败："+err.message;
});
</script></body></html>
