<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>忍者必须死3 · 动画素材库</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;background:#0f121b;color:#e8ecf5}header{padding:34px clamp(18px,5vw,72px);background:linear-gradient(130deg,#21283a,#461f2e)}
h1{margin:0 0 10px}header p{color:#cad0d9;line-height:1.6}main{max-width:1440px;margin:auto;padding:24px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{background:#252b37;border:1px solid #4c5668;border-radius:20px;color:#fff;padding:10px 18px;cursor:pointer}
button.active{background:#b03555;border-color:#c95175}.summary{color:#aab2c0;margin:12px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
article{min-width:0;background:#1c2330;border:1px solid #323b4d;border-radius:12px;overflow:hidden}
.poster{height:230px;background:#131721;display:flex;justify-content:center;align-items:center;color:#8b91a0}
.poster img{width:100%;height:100%;object-fit:contain}article .meta{padding:14px}
article h3{font-size:16px;margin:0 0 8px}article p{font-size:12px;color:#b1bac7;margin:5px 0}
a{color:#ff94b0}small{color:#c3ad71}
</style></head>
<body><header><h1>忍者必须死3 · 动画素材库</h1><p>角色 · Boss · 武器 · 场景<br>本页面优先展示已入库的本地图片，候选素材的外站预览不表示图片已经下载。图源与版权归原权利方。</p></header>
<main><nav id="filters"></nav><p id="summary" class="summary">读取索引中……</p><div class="grid" id="grid"></div></main>
<script>
const labels={all:'全部',characters:'角色',bosses:'Boss / 怪物',weapons:'武器',backgrounds:'场景'};
let data=[],current='all';
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
 document.querySelector('#filters').innerHTML=Object.entries(labels).map(([k,v])=>'<button class="'+(current===k?'active':'')+'" data-kind="'+k+'">'+v+'</button>').join('');
 document.querySelectorAll('button[data-kind]').forEach(b=>b.onclick=()=>{current=b.dataset.kind;draw()});
 const rows=data.filter(x=>current==='all'||x.category===current);
 const saved=rows.filter(x=>x.download_status==='downloaded').length;
 document.querySelector('#summary').textContent=rows.length+' 条素材记录 · 索引标记已下载 '+saved+' · 候选图片需人工核对内容及版权';
 const grid=document.querySelector('#grid');grid.innerHTML='';
 for(const a of rows){
  const art=document.createElement('article'),post=document.createElement('div');post.className='poster';
  const im=document.createElement('img');im.loading='lazy';im.alt=a.name;im.referrerPolicy='no-referrer';
  im.src=(a.download_status==='downloaded'?a.local_path:a.image_url);
  im.onerror=()=>{if(a.download_status==='downloaded' && !im.dataset.fallback){im.dataset.fallback='1';im.src=a.image_url;}else{post.textContent='图片暂不可用';im.remove()}};
  post.append(im);const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML='<h3>'+escapeText(a.name)+'</h3><p>'+escapeText(a.category)+' · '+escapeText(a.id)+'</p><p><small>'+(a.download_status==='downloaded'?'索引标记已下载':'仅候选直链，未下载')+'</small></p>';
  const link=document.createElement('a');link.href=a.source_page;link.textContent='查看来源';link.target='_blank';link.rel='noopener noreferrer';
  meta.append(link);art.append(post,meta);grid.append(art);
 }
}
fetch('./catalog/assets.json').then(x=>{if(!x.ok)throw Error(x.status);return x.json()}).then(cat=>{data=cat.assets;draw()}).catch(err=>{document.querySelector('#summary').textContent='无法载入素材索引：'+err+'（本页需通过 HTTP 服务器打开）'});
</script></body></html>
